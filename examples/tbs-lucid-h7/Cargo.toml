[package]
name = "tbs_lucid_h7"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-time = { version = "0.5.1", features = [
  "defmt",
  "defmt-timestamp-uptime",
] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
tbs-lucid-h7-bsp = "0.1.0"
uf-dps3xx = { path = "../..", features = ["defmt"] }

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
